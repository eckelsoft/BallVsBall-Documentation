<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">BallVsBall match flow</title>
  <desc id="desc">Choose a ball, confirm the aim, then battle through rounds. The first side to win three rounds wins the match.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111e32"/><stop offset="1" stop-color="#0b1423"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#13aee6"/><stop offset="1" stop-color="#0873b8"/></linearGradient>
    <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#f34aaf"/><stop offset="1" stop-color="#b92782"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5b7593"/></marker>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <text x="56" y="58" fill="#8fa8c4" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">THE MATCH LOOP</text>
  <text x="56" y="104" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="32" font-weight="800">Pick. Aim. Battle. Run it back.</text>
  <path d="M376 213h55M773 213h55" stroke="#5b7593" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <rect x="56" y="142" width="320" height="142" rx="17" fill="#1a2c42" stroke="#20d2ef" stroke-width="2"/>
    <circle cx="91" cy="179" r="18" fill="#0873b8"/><text x="91" y="185" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
    <text x="122" y="186" fill="#fff" font-size="21" font-weight="800">CHOOSE YOUR BALLS</text>
    <text x="82" y="229" fill="#b9cadd" font-size="17">Single-ball: 1 pick from 3 offers</text>
    <text x="82" y="258" fill="#b9cadd" font-size="17">Two-ball: 2 picks from 4 offers</text>
    <rect x="440" y="142" width="333" height="142" rx="17" fill="#1a2c42" stroke="#738ca9" stroke-width="2"/>
    <circle cx="475" cy="179" r="18" fill="#45617e"/><text x="475" y="185" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
    <text x="506" y="186" fill="#fff" font-size="21" font-weight="800">SET YOUR AIM</text>
    <text x="466" y="229" fill="#b9cadd" font-size="17">Confirm the direction of</text>
    <text x="466" y="258" fill="#b9cadd" font-size="17">each selected ball.</text>
    <rect x="837" y="142" width="307" height="142" rx="17" fill="#1a2c42" stroke="#f34aaf" stroke-width="2"/>
    <circle cx="872" cy="179" r="18" fill="#b92782"/><text x="872" y="185" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3</text>
    <text x="903" y="186" fill="#fff" font-size="21" font-weight="800">FIGHT THE ROUND</text>
    <text x="863" y="229" fill="#b9cadd" font-size="17">Abilities trigger automatically.</text>
    <text x="863" y="258" fill="#b9cadd" font-size="17">Rounds decide the match.</text>
    <rect x="56" y="314" width="1088" height="43" rx="12" fill="#17283c"/>
    <circle cx="84" cy="335" r="7" fill="#22d3ee"/><text x="103" y="341" fill="#f4f7fb" font-size="17" font-weight="700">First side to 3 round wins takes the match</text>
    <text x="1120" y="341" text-anchor="end" fill="#9fb4ca" font-size="16">Tie: no point</text>
  </g>
</svg>
