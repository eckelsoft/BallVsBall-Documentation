<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">BallVsBall rewards and Gold</title>
  <desc id="desc">Earn Gold from rounds, matches, milestones, and quests. Spend it on rerolls and a ball pick for one round. Rare rewards can grant free tokens.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111e32"/><stop offset="1" stop-color="#0b1423"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffcf70"/><stop offset="1" stop-color="#ef8e37"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7890aa"/></marker>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg)"/>
  <text x="56" y="58" fill="#8fa8c4" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">REWARDS &amp; PROGRESSION</text>
  <text x="56" y="104" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="32" font-weight="800">Play rounds. Build your Gold. Choose your next move.</text>
  <path d="M348 220h70M764 220h70" stroke="#7890aa" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <rect x="56" y="142" width="292" height="159" rx="17" fill="#1a2c42" stroke="#22d3ee" stroke-width="2"/>
    <text x="82" y="180" fill="#fff" font-size="20" font-weight="800">EARN GOLD</text>
    <text x="82" y="217" fill="#b9cadd" font-size="17">Round win +20 · loss +5</text>
    <text x="82" y="245" fill="#b9cadd" font-size="17">Match win +110 base</text>
    <text x="82" y="273" fill="#b9cadd" font-size="17">Quests and playtime rewards</text>
    <rect x="418" y="142" width="346" height="159" rx="17" fill="#1a2c42" stroke="#e6a84d" stroke-width="2"/>
    <text x="444" y="180" fill="#fff" font-size="20" font-weight="800">SPEND GOLD</text>
    <text x="444" y="217" fill="#f7cc7b" font-size="17" font-weight="700">250 · reroll ball offers</text>
    <text x="444" y="245" fill="#f7cc7b" font-size="17" font-weight="700">1,000 · pick an unoffered ball</text>
    <text x="444" y="273" fill="#b9cadd" font-size="16">A paid pick is used for one round.</text>
    <rect x="834" y="142" width="310" height="159" rx="17" fill="#1a2c42" stroke="#b68cff" stroke-width="2"/>
    <text x="860" y="180" fill="#fff" font-size="20" font-weight="800">RARE FREE TOKENS</text>
    <text x="860" y="217" fill="#d5c0ff" font-size="17">5% combined chance</text>
    <text x="860" y="245" fill="#b9cadd" font-size="16">Reroll or one-round Ball Pick</text>
    <text x="860" y="273" fill="#b9cadd" font-size="16">Claimed from eligible rewards</text>
    <rect x="56" y="322" width="1088" height="39" rx="12" fill="#192a3e"/>
    <text x="600" y="348" text-anchor="middle" fill="#f2c46d" font-size="17" font-weight="700">Daily quests pay 80–130 Gold · weekly quests pay 300–500 Gold</text>
  </g>
</svg>
